<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MC Server</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --bg: #0f0f0f; --surface: #1a1a1a; --border: #333; --text: #eee; --text2: #888; --green: #22c55e; --red: #ef4444; --blue: #3b82f6; }
        body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
        .container { max-width: 900px; margin: 0 auto; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .header h1 { font-size: 24px; }
        .status { padding: 4px 12px; border-radius: 20px; font-size: 12px; }
        .status.stopped { background: var(--red); }
        .status.running { background: var(--green); color: #000; }
        .status.starting, .status.downloading, .status.installing { background: var(--blue); }
        .card { background: var(--surface); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
        .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        select, button, input { padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 14px; }
        button { cursor: pointer; }
        button:hover { opacity: 0.9; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-green { background: var(--green); color: #000; border: none; }
        .btn-red { background: var(--red); border: none; }
        .btn-blue { background: var(--blue); border: none; }
        .console { background: #000; border-radius: 8px; padding: 12px; height: 400px; overflow-y: auto; font-family: monospace; font-size: 13px; white-space: pre-wrap; }
        .info { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
        .info-item { background: var(--bg); padding: 12px; border-radius: 8px; }
        .info-label { font-size: 11px; color: var(--text2); margin-bottom: 4px; }
        .info-value { font-size: 16px; font-weight: 600; }
        .cmd-row { display: flex; gap: 8px; margin-top: 12px; }
        .cmd-row input { flex: 1; }
        .quick-btns { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
        .quick-btns button { padding: 6px 12px; font-size: 12px; background: var(--surface); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⬛ MC Server</h1>
            <span class="status stopped" id="status">Stopped</span>
        </div>
        
        <div class="card">
            <div class="row">
                <select id="serverType">
                    <option value="vanilla">Vanilla</option>
                    <option value="paper">Paper</option>
                    <option value="fabric">Fabric</option>
                </select>
                <select id="version">
                    <option value="26.3">26.3</option>
                    <option value="26.2">26.2</option>
                    <option value="26.1">26.1</option>
                    <option value="26.0">26.0</option>
                    <option value="25.1">25.1</option>
                    <option value="25.0">25.0</option>
                    <option value="1.21.4" selected>1.21.4</option>
                    <option value="1.21.3">1.21.3</option>
                    <option value="1.21.1">1.21.1</option>
                    <option value="1.21">1.21</option>
                    <option value="1.20.6">1.20.6</option>
                    <option value="1.20.4">1.20.4</option>
                    <option value="1.20.1">1.20.1</option>
                    <option value="1.19.4">1.19.4</option>
                    <option value="1.18.2">1.18.2</option>
                    <option value="1.16.5">1.16.5</option>
                    <option value="1.12.2">1.12.2</option>
                    <option value="1.8.9">1.8.9</option>
                </select>
                <button class="btn-green" id="startBtn" onclick="startServer()">▶ Start</button>
                <button class="btn-red" id="stopBtn" onclick="stopServer()" disabled>■ Stop</button>
                <button class="btn-blue" id="tunnelBtn" onclick="toggleTunnel()">🌐 Tunnel</button>
            </div>
        </div>
        
        <div class="info">
            <div class="info-item">
                <div class="info-label">Players</div>
                <div class="info-value" id="players">0</div>
            </div>
            <div class="info-item">
                <div class="info-label">Address</div>
                <div class="info-value" id="address">-</div>
            </div>
        </div>
        
        <div class="card">
            <div class="console" id="console">Connecting...</div>
            <div class="cmd-row">
                <input type="text" id="cmdInput" placeholder="Enter command..." onkeypress="if(event.key==='Enter')sendCmd()">
                <button onclick="sendCmd()">Send</button>
            </div>
            <div class="quick-btns">
                <button onclick="sendCmd('list')">list</button>
                <button onclick="sendCmd('tps')">tps</button>
                <button onclick="sendCmd('time set day')">day</button>
                <button onclick="sendCmd('weather clear')">clear</button>
                <button onclick="sendCmd('gamemode creative @a')">creative</button>
                <button onclick="sendCmd('gamemode survival @a')">survival</button>
            </div>
        </div>
    </div>
    
    <script>
        let ws, status = 'stopped', tunnelStatus = 'stopped';
        const $ = id => document.getElementById(id);
        
        function connect() {
            ws = new WebSocket((location.protocol === 'https:' ? 'wss:' : 'ws:') + '//' + location.host + '/ws');
            ws.onopen = () => { $('console').textContent = 'Connected to server\n'; };
            ws.onmessage = e => {
                const msg = JSON.parse(e.data);
                if (msg.type === 'init') {
                    status = msg.status;
                    tunnelStatus = msg.tunnel?.status || 'stopped';
                    updateUI();
                    $('serverType').value = msg.config?.serverType || 'vanilla';
                    $('version').value = msg.config?.version || '1.21.4';
                    $('players').textContent = msg.players?.length || 0;
                    if (msg.tunnel?.address) $('address').textContent = msg.tunnel.address;
                    if (msg.logs?.length) $('console').textContent = msg.logs.join('\n') + '\n';
                    if (msg.versions) updateVersions(msg.versions);
                } else if (msg.type === 'status') {
                    status = msg.status;
                    updateUI();
                } else if (msg.type === 'log') {
                    $('console').textContent += msg.data + '\n';
                    $('console').scrollTop = $('console').scrollHeight;
                } else if (msg.type === 'players') {
                    $('players').textContent = msg.players?.length || 0;
                } else if (msg.type === 'tunnel') {
                    tunnelStatus = msg.status;
                    $('address').textContent = msg.address || '-';
                    $('tunnelBtn').textContent = msg.status === 'connected' ? '🌐 Stop Tunnel' : '🌐 Tunnel';
                }
            };
            ws.onclose = () => setTimeout(connect, 2000);
        }
        
        function updateUI() {
            $('status').textContent = status.charAt(0).toUpperCase() + status.slice(1);
            $('status').className = 'status ' + status;
            $('startBtn').disabled = !['stopped', 'error'].includes(status);
            $('stopBtn').disabled = status !== 'running';
        }
        
        function updateVersions(versions) {
            const type = $('serverType').value;
            const cur = $('version').value;
            const list = versions[type] || [];
            if (list.length) {
                $('version').innerHTML = list.map(v => `<option value="${v}">${v}</option>`).join('');
                $('version').value = list.includes(cur) ? cur : list[0];
            }
        }
        
        async function startServer() {
            $('console').textContent = 'Starting server...\n';
            await fetch('/api/change', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ serverType: $('serverType').value, version: $('version').value }) });
            await fetch('/api/start', { method: 'POST' });
        }
        
        async function stopServer() {
            await fetch('/api/stop', { method: 'POST' });
        }
        
        function sendCmd(cmd) {
            cmd = cmd || $('cmdInput').value.trim();
            if (!cmd) return;
            fetch('/api/command', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ command: cmd }) });
            $('cmdInput').value = '';
        }
        
        async function toggleTunnel() {
            if (tunnelStatus === 'connected') {
                await fetch('/api/tunnel/stop', { method: 'POST' });
            } else {
                await fetch('/api/tunnel/start', { method: 'POST' });
            }
        }
        
        $('serverType').onchange = () => {
            fetch('/api/versions').then(r => r.json()).then(updateVersions);
        };
        
        connect();
    </script>
</body>
</html>
