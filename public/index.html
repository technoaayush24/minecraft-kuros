<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Server</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; }
        .container { max-width: 1100px; margin: 0 auto; padding: 20px; }
        
        .header { background: linear-gradient(135deg, #16213e, #0f3460); padding: 30px; border-radius: 12px; margin-bottom: 20px; text-align: center; }
        .header h1 { font-size: 2rem; color: #4ade80; margin-bottom: 8px; }
        .header p { opacity: 0.7; }
        
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 20px; }
        .stat { background: #16213e; padding: 20px; border-radius: 10px; text-align: center; }
        .stat .icon { font-size: 1.5rem; margin-bottom: 8px; }
        .stat .value { font-size: 1.8rem; font-weight: bold; color: #4ade80; }
        .stat .label { font-size: 0.75rem; opacity: 0.6; margin-top: 4px; }
        .stat.warning .value { color: #fbbf24; }
        .stat.error .value { color: #f87171; }
        
        .grid { display: grid; grid-template-columns: 1fr 280px; gap: 20px; }
        @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } .stats { grid-template-columns: repeat(2, 1fr); } }
        
        .console { background: #0f0f1a; border-radius: 10px; overflow: hidden; }
        .console-header { background: #16213e; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
        .console-header h2 { font-size: 0.9rem; }
        .console-output { height: 350px; overflow-y: auto; padding: 12px; font-family: 'Consolas', monospace; font-size: 0.8rem; color: #94a3b8; line-height: 1.5; }
        .console-output .info { color: #60a5fa; }
        .console-output .warn { color: #fbbf24; }
        .console-output .error { color: #f87171; }
        .console-output .player { color: #4ade80; }
        .console-input { display: flex; border-top: 1px solid #1e293b; }
        .console-input input { flex: 1; background: #0a0a12; border: none; padding: 12px; color: #eee; font-family: 'Consolas', monospace; font-size: 0.85rem; }
        .console-input input:focus { outline: none; background: #111827; }
        .console-input button { background: #4ade80; color: #000; border: none; padding: 12px 20px; cursor: pointer; font-weight: bold; }
        
        .sidebar { display: flex; flex-direction: column; gap: 15px; }
        .panel { background: #16213e; border-radius: 10px; padding: 16px; }
        .panel h3 { font-size: 0.85rem; margin-bottom: 12px; color: #94a3b8; }
        
        .connect-box { background: #0f0f1a; padding: 12px; border-radius: 6px; font-family: 'Consolas', monospace; font-size: 0.85rem; color: #4ade80; word-break: break-all; }
        .connect-box small { display: block; margin-top: 8px; color: #64748b; font-family: 'Segoe UI', sans-serif; }
        
        .player-list { list-style: none; }
        .player-list li { padding: 8px 10px; background: #0f3460; border-radius: 6px; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; font-size: 0.9rem; }
        .player-list li::before { content: '🟢'; font-size: 0.6rem; }
        .no-players { color: #64748b; font-style: italic; font-size: 0.85rem; }
        
        .cmd-btn { display: block; width: 100%; padding: 10px; margin-bottom: 8px; background: #0f3460; border: none; border-radius: 6px; color: #eee; cursor: pointer; font-size: 0.85rem; text-align: left; }
        .cmd-btn:hover { background: #1e40af; }
        .cmd-btn span { opacity: 0.5; font-size: 0.75rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⛏️ Minecraft Server</h1>
            <p>Kuros-hosted • Paper 1.21.1 • Java Edition</p>
        </div>
        
        <div class="stats">
            <div class="stat" id="statusCard">
                <div class="icon">🖥️</div>
                <div class="value" id="status">Starting</div>
                <div class="label">STATUS</div>
            </div>
            <div class="stat">
                <div class="icon">👥</div>
                <div class="value" id="players">0</div>
                <div class="label">PLAYERS</div>
            </div>
            <div class="stat">
                <div class="icon">⏱️</div>
                <div class="value" id="uptime">0m</div>
                <div class="label">UPTIME</div>
            </div>
            <div class="stat">
                <div class="icon">📊</div>
                <div class="value" id="logs">0</div>
                <div class="label">LOG LINES</div>
            </div>
        </div>
        
        <div class="grid">
            <div class="console">
                <div class="console-header">
                    <h2>📋 Console</h2>
                    <span id="connStatus" style="color:#4ade80;font-size:0.75rem;">● Connected</span>
                </div>
                <div class="console-output" id="output">Connecting...</div>
                <div class="console-input">
                    <input type="text" id="cmdInput" placeholder="Enter command..." autocomplete="off">
                    <button onclick="sendCmd()">Send</button>
                </div>
            </div>
            
            <div class="sidebar">
                <div class="panel">
                    <h3>🔗 SERVER ADDRESS</h3>
                    <div class="connect-box" id="serverAddr">Loading...</div>
                </div>
                
                <div class="panel">
                    <h3>👥 ONLINE PLAYERS</h3>
                    <ul class="player-list" id="playerList">
                        <li class="no-players">No players online</li>
                    </ul>
                </div>
                
                <div class="panel">
                    <h3>⚡ QUICK COMMANDS</h3>
                    <button class="cmd-btn" onclick="sendCmd('list')">list <span>Show players</span></button>
                    <button class="cmd-btn" onclick="sendCmd('tps')">tps <span>Server performance</span></button>
                    <button class="cmd-btn" onclick="sendCmd('time set day')">time set day <span>Set daytime</span></button>
                    <button class="cmd-btn" onclick="sendCmd('weather clear')">weather clear <span>Clear weather</span></button>
                    <button class="cmd-btn" onclick="sendCmd('say Hello!')">say Hello! <span>Broadcast</span></button>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const $ = id => document.getElementById(id);
        let ws;
        
        // Server address (MC port 25565 won't work on Kuros - just HTTP)
        $('serverAddr').innerHTML = location.hostname + ':25565<small>⚠️ Note: Kuros only exposes HTTP port. MC port may not be accessible externally.</small>';
        
        function connect() {
            const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(proto + '//' + location.host + '/ws/console');
            
            ws.onopen = () => {
                $('connStatus').innerHTML = '● Connected';
                $('connStatus').style.color = '#4ade80';
            };
            
            ws.onclose = () => {
                $('connStatus').innerHTML = '● Disconnected';
                $('connStatus').style.color = '#f87171';
                setTimeout(connect, 3000);
            };
            
            ws.onmessage = (e) => {
                try {
                    const msg = JSON.parse(e.data);
                    if (msg.type === 'status') updateStatus(msg.status);
                    else if (msg.type === 'log') appendLog(msg.data);
                    else if (msg.type === 'logs') { $('output').innerHTML = ''; msg.data && appendLog(msg.data); }
                    else if (msg.type === 'players') updatePlayers(msg.players);
                } catch(e) {}
            };
        }
        
        function updateStatus(status) {
            const map = { starting: 'Starting...', downloading: 'Downloading...', running: 'ONLINE', restarting: 'Restarting...', error: 'ERROR' };
            $('status').textContent = map[status] || status;
            $('statusCard').className = 'stat' + (status === 'error' ? ' error' : status === 'running' ? '' : ' warning');
        }
        
        function appendLog(text) {
            const out = $('output');
            text.split('\n').forEach(line => {
                if (!line.trim()) return;
                const span = document.createElement('div');
                if (line.includes('WARN')) span.className = 'warn';
                else if (line.includes('ERROR')) span.className = 'error';
                else if (line.includes('INFO')) span.className = 'info';
                else if (line.includes('logged in') || line.includes('left the game')) span.className = 'player';
                span.textContent = line;
                out.appendChild(span);
            });
            out.scrollTop = out.scrollHeight;
            $('logs').textContent = out.childNodes.length;
        }
        
        function updatePlayers(list) {
            $('players').textContent = list.length;
            $('playerList').innerHTML = list.length ? list.map(p => `<li>${p}</li>`).join('') : '<li class="no-players">No players online</li>';
        }
        
        function sendCmd(cmd) {
            cmd = cmd || $('cmdInput').value.trim();
            if (!cmd || !ws || ws.readyState !== WebSocket.OPEN) return;
            ws.send(JSON.stringify({ type: 'command', data: cmd }));
            $('cmdInput').value = '';
        }
        
        $('cmdInput').addEventListener('keydown', e => { if (e.key === 'Enter') sendCmd(); });
        
        // Update uptime
        setInterval(() => {
            fetch('/api/status').then(r => r.json()).then(d => {
                const m = Math.floor(d.uptime / 60);
                $('uptime').textContent = m < 60 ? m + 'm' : Math.floor(m/60) + 'h ' + (m%60) + 'm';
            }).catch(() => {});
        }, 30000);
        
        connect();
    </script>
</body>
</html>
